<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'unsafe-inline' https://cdn.jsdelivr.net;">
  <title>Git History</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3.4.47/bundles/css/diff2html.min.css">
</head>
<body>
  <div id="app">
    <div id="diff-controls">
      <div class="segmented-control">
        <button id="unified-btn" class="active">Unified</button>
        <button id="side-by-side-btn">Side by Side</button>
      </div>
      <button id="copy-btn" class="copy-btn" title="Copy commit message (Ctrl+Shift+C) / Copy hash (Ctrl+Shift+H) / Copy info (Ctrl+Shift+I)">Copy</button>
      <button id="compare-parent-btn" class="compare-parent-btn" title="Compare with parent (Ctrl+Alt+P)">Compare</button>
      <button id="word-wrap-btn" class="word-wrap-btn" title="Toggle word wrap (Ctrl+Shift+W)">Wrap</button>
      <button id="ignore-ws-btn" class="ignore-ws-btn" title="Toggle ignore whitespace (Ctrl+Shift+J)">W</button>
      <button id="context-lines-btn" class="context-lines-btn" title="Diff context lines (Ctrl+Shift+/)">
        <span id="context-lines-value">3</span>
      </button>
      <button id="sort-btn" class="sort-btn" title="Sort: Newest first (click to toggle)">&#x2193; Newest</button>
      <button id="merge-toggle-btn" class="merge-toggle-btn" title="Hide merge commits">No Merge</button>
      <button id="graph-toggle-btn" class="graph-toggle-btn active" title="Graph visible (click to hide)">Graph</button>
      <button id="signatures-toggle-btn" class="signatures-toggle-btn active" title="GPG signatures visible (click to hide)">Signatures</button>
      <button id="my-commits-btn" class="my-commits-btn" title="Show only my commits (Ctrl+Shift+M)">My Commits</button>
      <button id="export-btn" class="export-btn" title="Export filtered commits (Ctrl+Shift+O)">Export</button>
      <button id="refresh-btn" title="Refresh (Ctrl+Shift+R)">&#x21bb;</button>
    </div>

    <div id="main-content">
      <div id="diff-viewer"></div>
      <div id="vertical-resizer"></div>

      <div id="bottom-panel">
        <div id="commit-table-container">
          <div class="search-container">
            <input type="text" id="search-input" placeholder="Search: message, author, email, hash, tag | author:name | tag:name | branch:name | path:name | after:2024-01-01 | last:7days">
            <button id="regex-toggle-btn" class="regex-toggle-btn" title="Toggle regex search mode (Ctrl+Shift+X)">.*</button>
            <button id="copy-filter-query-btn" class="copy-filter-query-btn" title="Copy filter query (Ctrl+Shift+5)">Copy Filter</button>
            <button id="paste-filter-query-btn" class="paste-filter-query-btn" title="Paste filter query from clipboard (Ctrl+Shift+4)">Paste Filter</button>
            <button id="clear-all-filters-btn" class="clear-all-filters-btn" title="Clear all filters (Ctrl+Alt+Q)">Clear All</button>
            <div class="date-filter-buttons">
              <button id="today-filter-btn" class="date-filter-btn" title="Show commits from today (last:1day)">Today</button>
              <button id="this-week-filter-btn" class="date-filter-btn" title="Show commits from this week (last:7days)">Week</button>
              <button id="this-month-filter-btn" class="date-filter-btn" title="Show commits from this month (last:1month)">Month</button>
            </div>
            <button id="save-preset-btn" class="save-preset-btn" title="Save filter preset (Ctrl+Shift+0)">Save Preset</button>
            <button id="preset-dropdown-btn" class="preset-dropdown-btn" title="Load filter preset (Ctrl+Shift+1)">⭐ Presets</button>
            <div id="commit-count" class="commit-count"></div>
          </div>
          <table id="commit-table">
            <thead>
              <tr>
                <th class="graph-col">Graph</th>
                <th class="hash-col">Hash</th>
                <th class="author-col">Author</th>
                <th class="date-col">Date</th>
                <th class="stats-col">Stats</th>
                <th class="message-col">Message</th>
              </tr>
            </thead>
            <tbody id="commit-list"></tbody>
          </table>
        </div>

        <div id="horizontal-resizer"></div>

        <div id="commit-detail">
          <div id="commit-detail-header">
            <span class="detail-label">Changed Files</span>
          </div>
          <ul id="file-list"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/diff2html@3.4.47/bundles/js/diff2html-ui.min.js"></script>
  <script src="graphLayout.js"></script>
  <script src="main.js"></script>
</body>
</html>
